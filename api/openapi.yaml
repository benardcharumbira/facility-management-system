components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Clerk issued session token, validated against Clerk’s published JWKS. The application role is resolved on the server from the token’s subject. The mock accepts `Bearer user:<id>` instead.
  responses:
    Unauthenticated:
      description: No valid session.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            default:
              value:
                type: https://midvaal.example/problems/unauthenticated
                title: No valid session.
                status: 401
    Forbidden:
      description: The caller’s role does not allow this.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            default:
              value:
                type: https://midvaal.example/problems/forbidden
                title: The caller’s role does not allow this.
                status: 403
    ServerError:
      description: The service failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            default:
              value:
                type: https://midvaal.example/problems/internal-error
                title: The service failed.
                status: 500
  schemas:
    ActionAvailability:
      type: object
      properties:
        allowed:
          type: boolean
        blockedReason:
          type:
            - string
            - "null"
      required:
        - allowed
        - blockedReason
    ActionNotAllowedProblem:
      type: object
      properties:
        type:
          type: string
          const: https://midvaal.example/problems/action-not-allowed
