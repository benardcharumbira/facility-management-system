          schema:
            type: string
        - name: entityType
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - booking
                - user
                - terms
                - seating_arrangement
                - event_type
                - audit
        - name: entityId
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - booking.created
                - booking.submitted
                - booking.approved
                - booking.rejected
                - booking.cancelled
                - booking.reschedule_requested
                - booking.reschedule_approved
                - booking.reschedule_declined
                - user.role_changed
                - user.facilities_changed
                - user.deactivated
                - user.reactivated
                - terms.draft_created
                - terms.draft_updated
                - terms.published
                - seating_arrangement.created
                - seating_arrangement.updated
                - seating_arrangement.archived
                - seating_arrangement.restored
                - event_type.created
                - event_type.updated
                - event_type.archived
                - event_type.restored
                - audit.exported
        - name: reference
          in: query
          required: false
          description: A booking reference, in part, case insensitive.
          schema:
            type: string
      responses:
        "200":
          description: The rows as CSV, with a header row. Cells a spreadsheet would run as a formula are neutralised.
          headers:
            Content-Disposition:
              description: attachment; filename="audit-{from}-to-{to}.csv"
              schema:
                type: string
            X-Row-Count:
              description: The number of rows exported.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
              examples:
                default:
                  summary: One booking, over three months
                  description: "`GET /admin/audit/export?reference=00417&from=2026-08-01&to=2026-11-02` as mock-sysadmin"
                  value: "When (UTC),Actor,Actor id,Action,Entity type,Entity,Entity id,Summary,Before,After\r

                    2026-09-10T08:00:00Z,Nomsa Dlamini,mock-approver-1,booking.reschedule_approved,booking,MVL-2026-00417,bk-h-417,Nomsa Dlamini approved moving the booking.,\"{\"\"status\"\":\"\"approved\"\"}\",\"{\"\"status\"\":\"\"approved\"\",\"\"facility\"\":\"\"Rothdene Hall\"\"}\"\r

                    2026-09-09T08:00:00Z,Thabo Mokoena,applicant-001,booking.reschedule_requested,booking,MVL-2026-00417,bk-h-417,Thabo Mokoena asked to move the booking.,\"{\"\"status\"\":\"\"approved\"\"}\",\"{\"\"status\"\":\"\"approved\"\",\"\"facility\"\":\"\"Rothdene Hall\"\"}\"\r

                    2026-08-21T10:00:00Z,Nomsa Dlamini,mock-approver-1,booking.approved,booking,MVL-2026-00417,bk-h-417,Nomsa Dlamini approved the request.,\"{\"\"status\"\":\"\"pending\"\"}\",\"{\"\"status\"\":\"\"approved\"\",\"\"facility\"\":\"\"Rothdene Hall\"\"}\""
        "400":
