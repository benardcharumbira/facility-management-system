  /admin/audit/export:
    get:
      operationId: exportAudit
      tags:
        - Audit
      summary: The same filters as CSV. Both ends of a date range are required.
      description: |-
        The export is itself an audit event, recording the actor, the filters and the row count. There is no unfiltered export.

        Roles: system administrator.
      x-slice: 11
      parameters:
        - name: from
          in: query
          required: true
          description: Required.
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
