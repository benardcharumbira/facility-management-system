      parameters:
        - name: from
          in: query
          required: false
          description: First day, inclusive, in the facility time zone.
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            example: "2026-11-14"
        - name: to
          in: query
          required: false
          description: Last day, inclusive.
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            example: "2026-11-14"
        - name: actor
          in: query
          required: false
          description: Matches the actor's name or id.
          schema:
            type: string
        - name: entityType
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - booking
                - user
                - terms
                - seating_arrangement
                - event_type
                - audit
        - name: entityId
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - booking.created
                - booking.submitted
                - booking.approved
                - booking.rejected
                - booking.cancelled
                - booking.reschedule_requested
                - booking.reschedule_approved
                - booking.reschedule_declined
                - user.role_changed
                - user.facilities_changed
                - user.deactivated
                - user.reactivated
                - terms.draft_created
                - terms.draft_updated
                - terms.published
