    put:
      operationId: saveAllocationBatch
      tags:
        - Resources
      summary: Apply a batch of allocation changes, entirely or not at all.
      description: |-
        Every change is validated first and a bad one refuses the whole batch with 422. If applying then fails part way, everything is put back and the answer is 409 batch not saved.

        Roles: facility administrator, system administrator.
      x-slice: 10
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchAllocationRequest"
            examples:
              default:
                summary: Two changes
                value:
                  changes:
                    - facilityId: rothdene-hall
                      resourceId: chairs
                      value: 240
                    - facilityId: lakeside-hall
                      resourceId: stage
                      value: true
              partialFailure:
                summary: A facility whose stock is locked fails the batch part way; nothing is saved
                value:
                  changes:
                    - facilityId: rothdene-hall
                      resourceId: chairs
                      value: 230
                    - facilityId: bantu-bonke-hall
                      resourceId: chairs
                      value: 40
              invalid:
                summary: A value of the wrong kind refuses the batch
                value:
                  changes:
                    - facilityId: rothdene-hall
                      resourceId: stage
                      value: 5
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchSaved"
              examples:
                default:
                  summary: Two changes
                  description: "`PUT /admin/resource-allocations` as mock-approver-1"
                  value:
                    applied: 2
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The request conflicts with the state of the record. The problem `type` says how.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BatchNotSavedProblem"
              examples:
                partialFailure:
                  summary: A facility whose stock is locked fails the batch part way; nothing is saved
                  description: "`PUT /admin/resource-allocations` as mock-approver-1"
                  value:
                    type: https://midvaal.example/problems/batch-not-saved
                    title: The batch was not saved
                    status: 409
                    detail: Bantu Bonke Hall's stock is locked while a stocktake is under way. Nothing in this batch was saved.
        "422":
          description: Validation failed. `errors` maps each field at fault to its messages.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
              examples:
                invalid:
                  summary: A value of the wrong kind refuses the batch
                  description: "`PUT /admin/resource-allocations` as mock-approver-1"
                  value:
                    type: https://midvaal.example/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: One or more fields are invalid.
                    errors:
                      changes.0:
                        - "Stage is not counted: it is available or not."
        5XX:
          $ref: "#/components/responses/ServerError"
