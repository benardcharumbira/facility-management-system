  /facilities/{id}/availability:
    get:
      operationId: getAvailability
      tags:
        - Availability
      summary: What is free and what is not, day by day, for a range of up to 62 days.
      description: |-
        The server owns the merge, the buffer expansion and the hierarchy resolution. The client renders segments as given and never derives blocking from the hierarchy.

        Any signed in user.
      x-slice: 4
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The identifier of the record.
        - name: from
          in: query
          required: true
          description: First day, inclusive, in the facility time zone.
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            example: "2026-11-14"
        - name: to
          in: query
          required: true
          description: Last day, inclusive. At most 62 days from `from`.
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
