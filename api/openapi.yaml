# GENERATED by `npm run api:generate` from src/shared/api/schemas. Do not edit by hand.
openapi: 3.1.0
info:
  title: Facilities Booking API
  version: 1.0.0
  description: |-
    The API for the Midvaal facilities booking service. **Generated** from the schemas in `src/shared/api/schemas`; do not edit by hand. Examples are real responses captured from the mock.

    Read `api/BEHAVIOUR.md` alongside this document: it carries the rules a schema cannot, such as that the server resolves facility hierarchy and that an impact check never changes anything.

    **Conventions.** Collections use one envelope (`items`, `page`, `pageSize`, `totalItems`, `totalPages`). Multi value filters repeat the parameter. `sort` takes a field, with a leading `-` for descending. Every instant is UTC ISO 8601 ending in `Z`; a date with no time is an ISO date in the facility time zone; wall clock times are `HH:mm` in the facility time zone. Errors are RFC 7807 problem documents with a stable `type` URI.
servers:
  - url: /api
    description: Relative to the host
tags:
  - name: Session
    description: Who the caller is, and their own profile.
  - name: Public
    description: "Unauthenticated content: the landing page, the terms and the static pages."
  - name: Facilities
    description: Browsing the public estate.
  - name: Availability
    description: What is free, day by day. The server resolves hierarchy, buffers and holds.
  - name: Bookings
    description: An applicant’s own bookings, from draft to cancellation.
  - name: Approvals
    description: The approver’s queue and decisions.
  - name: Facility administration
    description: Facilities, their hours, closures, images, capacity and approvers.
  - name: Resources
    description: The resource catalogue and what each facility holds.
  - name: Users
    description: Roles, designation and account status. Clerk owns the profile.
  - name: Reference data
    description: Seating arrangements, event types and the terms and conditions.
  - name: Audit
    description: The audit trail and its export.
security:
  - bearerAuth: []
paths:
