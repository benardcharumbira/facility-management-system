        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Validation failed. `errors` maps each field at fault to its messages.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
              examples:
                noRange:
