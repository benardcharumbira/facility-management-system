  /admin/facilities:
    get:
      operationId: listAdminFacilities
      tags:
        - Facility administration
      summary: Every facility, archived on request, with each parent followed by its children.
      description: "Roles: facility administrator, system administrator."
      x-slice: 9
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: locality
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          required: false
          description: Archived facilities are left out unless asked for.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - active
                - unavailable
                - archived
        - name: structure
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - parent
                - child
                - standalone
        - name: sort
          in: query
          required: false
          schema:
            default: hierarchy
            type: string
            enum:
              - hierarchy
              - name
              - type
              - locality
              - status
              - -futureBookings
