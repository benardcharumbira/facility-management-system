  /facilities:
    get:
      operationId: listFacilities
      tags:
        - Facilities
      summary: "Browse the public estate: filters, sort and the standard envelope."
      description: |-
        Groups combine with AND. Within a group, `type` and `locality` are OR and `amenities` is AND. Archived facilities are never returned.

        Any signed in user.
      x-slice: 2
      parameters:
        - name: q
          in: query
          required: false
          description: Every whitespace separated word must match name, code, short description or locality.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Repeated. Values are OR.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: locality
          in: query
          required: false
          description: Repeated. Values are OR.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: minCapacity
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
        - name: maxCapacity
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
        - name: amenities
          in: query
          required: false
          description: "Repeated. Values are AND: all must be present."
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          required: false
          schema:
            default: active
            type: string
            enum:
              - active
              - unavailable
              - all
        - name: sort
          in: query
          required: false
          schema:
            default: name
            type: string
            enum:
              - name
              - -name
              - capacity
              - -capacity
              - type
              - locality
        - name: page
          in: query
          required: false
          description: 1 based. Default 1.
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: pageSize
          in: query
          required: false
          description: Default per endpoint, at most 100.
