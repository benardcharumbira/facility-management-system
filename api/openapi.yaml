      summary: "Who can be designated as an approver: active facility administrators."
      description: "Roles: facility administrator, system administrator."
      x-slice: 9
      parameters: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approver"
              examples:
                default:
