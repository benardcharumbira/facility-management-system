          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: pageSize
          in: query
          required: false
          description: Default per endpoint, at most 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Success.
